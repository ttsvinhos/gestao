<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preços e Guias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fino com separadores (em baixo no telemóvel), lista por fornecedor, editor em painel. Documentos impressos em A4 sem cor. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --field:#fafaf8; --ink:#1c2321; --muted:#5d6965; --line:#dde1dc;
  --accent:#7d2a3a; --accent-ink:#ffffff; --accent-soft:#f3e4e7;
  --good:#1f7a4d; --warn:#955400; --bad:#b3261e;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1b2120; --field:#161c1b; --ink:#e8ece9; --muted:#98a49f; --line:#2d3633;
  --accent:#e29aa8; --accent-ink:#1a1012; --accent-soft:#2f1e22; --good:#5fcf97; --warn:#e0a64a; --bad:#f08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1b2120; --field:#161c1b; --ink:#e8ece9; --muted:#98a49f; --line:#2d3633;
  --accent:#e29aa8; --accent-ink:#1a1012; --accent-soft:#2f1e22; --good:#5fcf97; --warn:#e0a64a; --bad:#f08a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;padding-inline:16px;padding-block:0 84px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:baseline;gap:8px}
.brand small.ver{text-transform:none;letter-spacing:0;font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface)}.brand small{font:500 .75rem var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px}
@media (min-width:721px){header.top{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}}
nav.tabs button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 12px;border-radius:var(--r);color:var(--muted);font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs{gap:8px;flex-wrap:wrap;justify-content:center}
nav.tabs button{flex-direction:column;justify-content:center;gap:4px;min-width:84px;padding:8px 10px;font-size:.78rem;line-height:1.15;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03)}
nav.tabs button:hover{border-color:var(--muted)}
nav.tabs button[aria-current="page"]{border-color:var(--accent)}
#btnSair{display:inline-flex;align-items:center;gap:6px;width:auto;flex:0 0 auto;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:600;line-height:1.2;white-space:nowrap}#btnSair:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}#btnSair svg{width:14px;height:14px}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:6px}
  nav.tabs button{flex:0 0 auto;min-width:68px;flex-direction:column;gap:2px;padding:7px 6px;font-size:.66rem}
  nav.tabs button .ic{width:20px;height:20px}
}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:12px}
.bar .grow{flex:1 1 180px;min-width:0}
.bar.tb .btn{padding:8px 11px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,tr[data-open]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.aj-fab{position:fixed;right:18px;bottom:18px;z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:800 1.3rem var(--fd);cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);transition:transform .2s}.aj-fab:hover{transform:scale(1.08)}.aj-pan{display:none;background:#fff !important;position:fixed;right:18px;bottom:76px;z-index:41;width:min(460px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:0 20px 50px -12px rgba(0,0,0,.45)}.aj-pan.on{display:block}.aj-hd{background:#fff !important;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}.aj-pan .aj-b{padding-top:8px}
details.ajuda-site{margin:14px 0 6px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh)}details.ajuda-site>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:1.02rem;list-style:none}details.ajuda-site>summary::-webkit-details-marker{display:none}details.ajuda-site>summary::after{content:'▾';float:right;transition:transform .2s}details.ajuda-site[open]>summary::after{transform:rotate(180deg)}.aj-b{padding:0 20px 18px;line-height:1.55;font-size:.95rem}.aj-b h4{margin:20px 0 6px;color:var(--accent);font-size:1rem}.aj-b ol,.aj-b ul{margin:4px 0 0;padding-left:22px}.aj-b li{margin:5px 0}

label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
label input,label select,label textarea{color:var(--ink);font-weight:400;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrapn{white-space:normal;min-width:180px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--field)}
td.n,th.n{text-align:right}
tr[data-open]{cursor:pointer} tr[data-open]:hover td{background:var(--accent-soft)}
tr.grp td{background:var(--field);font-family:var(--f-display);font-weight:700;padding-block:7px}
tr:last-child td{border-bottom:0}
.sub{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:transparent;border:1px solid var(--good);color:var(--good)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.note{border:1px dashed var(--warn);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-block:12px;font-size:.9rem}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,13,.55);display:none;align-items:center;justify-content:center;overflow:hidden;padding:16px}
#modal.on{display:flex}
.sheet{background:var(--surface);border-radius:12px;width:min(880px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line)}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:12px 12px 0 0;z-index:2}
.sheet .body{padding:18px;display:flex;flex-direction:column;gap:18px}
.sheet>footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 12px 12px}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.seg button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.calc{background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;align-self:start}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.calc div:last-child{border:0}
.calc .k{color:var(--muted)} .calc .tot{font-weight:700;font-size:1.05rem;border-bottom:1px solid var(--ink)}
.calc .tot span:last-child{color:var(--accent)}
.photo{width:120px;height:120px;border:1px dashed var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;overflow:hidden;background:var(--field) repeating-conic-gradient(#0000000d 0 25%,transparent 0 50%) 0 0/14px 14px}
.photo img{width:100%;height:100%;object-fit:cover}
.extra{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:8px}
.lines input,.lines select{padding:6px 8px}
.lines td{padding:6px 8px;vertical-align:middle}
.totbox{margin-left:auto;width:min(340px,100%)}
.totbox div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.totbox .big{font-family:var(--f-display);font-size:1.3rem;font-weight:700;border-top:2px solid var(--ink);margin-top:4px;padding-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;z-index:80;display:none}
#print{display:none}
/* documentos impressos */
.doc{font:12px/1.4 Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:0}
.doc h1{font:700 17px Arial,sans-serif;margin:0}
.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:10px}
.doc .hd img{max-height:100px;max-width:270px;width:auto;height:auto;display:block;margin-bottom:8px}
.doc .via{text-align:right;font-weight:700}
.doc .prov{border:1px solid #000;padding:4px 8px;font-weight:700;text-align:center;margin:10px 0 0}
.doc .addr{margin:14px 0 6px auto;width:82mm;min-height:28mm;font-size:12.5px;line-height:1.35}
.doc .pay{display:flex;gap:40px;margin-top:10px;font-size:11.5px}
.doc .bot{margin-top:auto;break-inside:avoid;padding-top:14px}
.doc.pg{display:flex;flex-direction:column;min-height:255mm}
.doc .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:10px}
.doc .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#444}
.doc table{font-size:11.5px;width:100%;border-collapse:collapse;margin-block:8px}
.doc th,.doc td{border-bottom:1px solid #999;padding:4px 6px;color:#000;background:none;white-space:normal}
.doc th{border-bottom:1.5px solid #000;font-size:10px}
.doc .sum{margin-left:auto;width:260px}
.doc .sum div{display:flex;justify-content:space-between;padding:2px 0}
.doc .sum .big{font-weight:700;font-size:14px;border-top:1.5px solid #000;margin-top:3px;padding-top:4px}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:30px}
.doc .sign div{border-top:1px solid #000;padding-top:3px;text-align:center;font-size:10px}
.doc .foot{margin-top:16px;font-size:10px;color:#333}
.doc.pg{break-after:page;break-inside:auto}.doc.pg:last-child{break-after:auto}.doc tr,.doc .sum,.doc .sign,.doc .cols,.doc .foot,.doc .prov,.doc .pay{break-inside:avoid}.doc thead{display:table-header-group}

.doc .fichagrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:12px 0}
.doc .fichagrid div{border-bottom:1px solid #bbb;padding:3px 0}
.doc .fichaimg{float:right;width:150px;margin:0 0 10px 16px}
@media print{
  :root:root:root{--bg:#fff;--ink:#000;--surface:#fff}
  @page{size:A4;margin:12mm}
  body{padding:0;background:#fff}
  .wrap,#modal,#toast,nav.tabs,#ajG,#ajGP,.aj-fab,.aj-pan,#gate,button,.fab{display:none!important}
  #print{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.gated header.top,body.gated #main,body.gated #modal{display:none!important}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg,#f6f4f1)}
#gate .gbox{width:100%;max-width:360px;background:#fff;border:1px solid var(--line,#ddd);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
#gate h1{margin:0;font-size:22px}#gate label{display:flex;flex-direction:column;gap:4px;font-size:13px}
#gate input{padding:10px;border:1px solid var(--line,#ccc);border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">Preços e Guias <small id="empName"></small><small class="ver" id="appVer" title="Versão da aplicação: confirme que é a mais recente depois de atualizar"></small></div>
    <nav class="tabs" id="tabs" aria-label="Secções"></nav>
  </header>
  <main id="main"></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="print"></div>

<script>
'use strict';
/* ---------- utilitários ---------- */
const KEY='precosGuias.v1';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eurF=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'});
const E=n=>eurF.format(n||0);
const PC=n=>(n==null||isNaN(n))?'—':(n*100).toLocaleString('pt-PT',{maximumFractionDigits:1})+' %';
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r4=n=>Math.round((n+Number.EPSILON)*10000)/10000;
const pn=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(x)?null:x};
const nf=v=>v==null?'':String(v).replace('.',',');
const val=(o,k)=>k.split('.').reduce((a,x)=>a==null?a:a[x],o);
function setv(o,k,v){const ks=k.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks[ks.length-1]]=v}
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dPT=s=>s?s.split('-').reverse().join('/'):'';
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2200)}

/* ---------- dados ---------- */
function blank(){return{v:1,exemplo:false,
 set:{empresa:{nome:'',nif:'',morada:'',cp:'',tel:'',email:'',iban:'',logo:''},modo:'markup',desc:0,transp:0,margem:0.4,regiao:'m',ivaTipos:ivaTiposDef(),
      serie:'GEP',pagamento:'Pronto pagamento',aviso:'Documento provisório, sem valor fiscal. O documento fiscal será enviado ou entregue posteriormente.',rodape:'Reclamações só se aceitam no prazo de oito dias.',cat:{titulo:'',subtitulo:'',intro:'',aviso:'',vantagens:'',vinhos:'Tinto, Branco, Rosé, Espumante',precos:false,iva:true}},
 forn:[],prod:[],cli:[],guias:[],castas:[],mov:[],ivaReg:5}}
function _pg(d){if(typeof d.set.pagLista!=='string'||!d.set.pagLista.trim())d.set.pagLista=PAG_DEF;return d}
function exemplos(){const d=blank();d.exemplo=true;
 const f={id:uid(),nome:'Fornecedor Exemplo',desc:0.15,transp:0.5,margem:0.4,regiao:'c',obs:''};d.forn.push(f);
 const mk=(nome,cat,fmt,tab,extra={})=>({id:uid(),ref:'',nome,categoria:cat,formato:fmt,fornId:f.id,tabela:tab,desc:null,bonusN:0,bonusM:0,transp:null,margem:null,iva:null,pvpFixo:null,embNome:'Cx',embQt:6,
   ficha:{produtor:'',regiao:'',casta:'',ano:'',alc:'',temp:'',guarda:'',prova:'',harmon:'',notas:'',foto:''},extras:[],...extra});
 d.prod.push(mk('Tinto Reserva (exemplo)','Tinto','0,75 L',4.5,{ficha:{produtor:'Produtor Exemplo',regiao:'Região Exemplo',casta:'Casta A, Casta B',ano:'2022',alc:'13,5 %',temp:'16–18 °C',guarda:'Até 8 anos',prova:'Cor rubi intensa, aroma a frutos vermelhos maduros e especiaria suave. Boca estruturada, taninos macios.',harmon:'Carnes vermelhas, queijos curados.',notas:'',foto:''}}),
   mk('Branco (exemplo)','Branco','0,75 L',3.4,{bonusN:10,bonusM:1}),
   mk('Azeite Virgem Extra (exemplo)','Azeite','2 L',19.95,{embNome:'Garrafa',embQt:1,desc:0}));
 d.cli.push({id:uid(),nome:'Cliente Exemplo, Lda.',nif:'000000000',morada:'Rua Exemplo, 1, 9000-000 Funchal',tel:'',desc:0.05,obs:''});
 return d}
let DB;
function load(){try{const r=localStorage.getItem(KEY);if(r){DB=JSON.parse(r);migrate(DB);DB.set.cat=Object.assign({titulo:'',subtitulo:'',intro:'',aviso:'',vantagens:'',vinhos:'Tinto, Branco, Rosé, Espumante',precos:false,iva:true},DB.set.cat||{});DB.castas=DB.castas||[];return}}catch(e){}
 DB=_pg(exemplos());try{migrate(DB)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Não foi possível guardar neste navegador. Faça uma cópia de segurança.')}try{nvAgenda()}catch(e){}try{bkSoon()}catch(e){}}

/* ---------- IVA por região ---------- */
const REG=[['c','Continente'],['m','Madeira'],['a','Açores']];
const regNome=k=>(REG.find(x=>x[0]===k)||['',''])[1];
const regOpts=(v,hab)=>(hab?`<option value="" ${v?'':'selected'}>${esc(hab)}</option>`:'')+REG.map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('');
function ivaTiposDef(){return[{id:'vinho',nome:'Vinhos comuns (tinto, branco, rosé)',c:0.13,m:0.12,a:0.09},{id:'alim',nome:'Azeite e alimentares (taxa reduzida)',c:0.06,m:0.04,a:0.04},{id:'normal',nome:'Espumantes e outros (taxa normal)',c:0.23,m:0.22,a:0.16}]}
function tipoAuto(p){const c=(p.categoria||'').toLowerCase();if(/azeite|óleo|oleo/.test(c))return'alim';if(/espumante|frisante|licoroso/.test(c))return'normal';if(/tinto|branco|^ros[eé]|espumante|vinho|verde/.test(c))return'vinho';return'normal'}
function tipoDe(p){const T=DB.set.ivaTipos;return T.find(x=>x.id===(p.ivaTipo||tipoAuto(p)))||T[T.length-1]}
function ivaRate(p,reg){if(p.iva!=null)return p.iva;return tipoDe(p)[reg||DB.set.regiao||'c']}
function regDe(p){const f=DB.forn.find(x=>x.id===p.fornId)||{};return f.regiao||DB.set.regiao||'c'}
const PAG_DEF='Pronto pagamento\nNumerário\nTransferência bancária\nMultibanco\nMB Way\nA 30 dias\nA 60 dias\nConsignação';
const pagOpts=()=>String(DB.set.pagLista||'').split('\n').map(x=>x.trim()).filter(Boolean);
/* ---------- stock ---------- */
const APP_VERSAO='v26 · 16/11/2026';

function fmtSt(p,un){const q=p.embQt>1?p.embQt:0,neg=un<0,a=Math.abs(un);let s;
 if(!q)s=a+' un';else{const c=Math.floor(a/q),r=a%q;s=(c?c+' '+(p.embNome||'cx').toLowerCase():'')+(c&&r?' + ':'')+(r||!c?r+' un':'')}
 return (neg?'−':'')+s}
const minUn=p=>{const m=pn(p.stockMin);return m==null||m<=0?0:Math.round(m*(p.embQt>1?p.embQt:1))};

function dAdd(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

 if(k==='mes')return[`${y}-${p(mo)}-01`,`${y}-${p(mo)}-${p(eom(y,mo))}`];

 if(k==='custom')return[ui.fde||'0000-01-01',ui.fate||'9999-12-31'];

function finSum(from,to){const S={n:0,net:0,iva:0,total:0,custo:0,lucro:0,cli:{},prod:{},mes:{},forn:{},cat:{},semCusto:0};
 (DB.guias||[]).forEach(G=>{if(!G.data||G.data<from||G.data>to)return;const T=gTotals(G);
  S.n++;S.net+=T.net;S.iva+=T.iva;S.total+=T.total;S.custo+=T.custo;S.lucro+=T.lucro;
  const ck=(G.cliente&&G.cliente.nome||'').trim()||'(sem cliente)';const c=S.cli[ck]=S.cli[ck]||{net:0,lucro:0,n:0};c.net+=T.net;c.lucro+=T.lucro;c.n++;
  const mk=G.data.slice(0,7);const m=S.mes[mk]=S.mes[mk]||{net:0,lucro:0};m.net+=T.net;m.lucro+=T.lucro;
  G.linhas.forEach(l=>{const un=l.qt*(l.unid==='emb'?(l.embQt||1):1),net=l.qt*l.preco*(1-l.desc),cu=un*(l.custoUn||0);if(!l.custoUn)S.semCusto++;
   const p=l.prodId&&DB.prod.find(x=>x.id===l.prodId),k=l.prodId||l.nome||'(linha livre)';
   const a=S.prod[k]=S.prod[k]||{nome:l.nome||'(linha livre)',un:0,net:0,lucro:0};a.un+=un;a.net+=net;a.lucro+=net-cu;
   const fk=p?fornNome(p.fornId):'(linhas livres)';const f=S.forn[fk]=S.forn[fk]||{net:0,lucro:0};f.net+=net;f.lucro+=net-cu;
   const tk=(p&&p.categoria)||'(sem categoria)';const t=S.cat[tk]=S.cat[tk]||{net:0,lucro:0};t.net+=net;t.lucro+=net-cu})});
 return S}
function despSum(from,to){const D={total:0,n:0,tipo:{},ref:{},lista:[]};(DB.desp||[]).forEach(x=>{if(!x.data||x.data<from||x.data>to)return;D.total+=x.valor;D.n++;D.tipo[x.tipo||'Outras']=(D.tipo[x.tipo||'Outras']||0)+x.valor;if(x.ref)D.ref[x.ref]=(D.ref[x.ref]||0)+x.valor;D.lista.push(x)});D.lista.sort((a,b)=>b.data.localeCompare(a.data));return D}

 a.href=URL.createObjectURL(b);a.download='vendas-'+(from>'0001'?from:'inicio')+'_'+(to<'9999'?to:'hoje')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='despesas-'+(from>'0001'?from:'inicio')+'_'+(to<'9999'?to:'hoje')+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

  ${tile('Despesas',E(D.total),`<div class="sub">${D.n} lançamento(s)</div>`+dh(D.total,PD&&PD.total))}${tile('Resultado estimado',`<span style="color:${res>=0?'#1e8449':'#b3261e'}">${E(res)}</span>`,'<div class="sub">Lucro estimado menos despesas</div>')}</div>

const AJ_GERAL=`<h4 data-aj="inicio">Por onde começar (uma vez)</h4><ol><li><b>Definições → Dados da empresa</b>: nome, NIF, morada, telefone e logótipo. Aparecem nas guias.</li><li><b>Fornecedores</b>: para cada um, o desconto de fábrica, o transporte, a margem e a região de compra (decide o IVA). Os produtos herdam estes valores.</li><li><b>Produtos</b>: confirme preços de tabela, formato e embalagem.</li><li><b>Stock</b>: faça a primeira contagem do armazém.</li><li>Depois já pode fazer <b>Guias</b>.</li></ol>
<h4 data-aj="produtos">Produtos</h4><ul><li>Procure por nome ou código e filtre por fornecedor ou categoria.</li><li><b>+ Produto</b> cria um novo. Clique numa linha para abrir a ficha.</li><li>O botão <b>+ Catálogo</b>, no fim de cada linha, põe esse produto no catálogo/site (fica <b>✓ No catálogo</b>). Carregue outra vez para retirar. Depois, em Catálogo / Site, decide o resto (preço, destaques) e publica.</li><li>Na ficha, o separador <b>Preço</b> tem o preço de tabela, desconto de fábrica, bónus, transporte e IVA; o custo e a venda calculam-se sozinhos. <b>O bónus (ex.: 10+1) não baixa o preço de venda</b>: só baixa o custo real, e as unidades oferecidas entram no stock.</li><li>O separador <b>Ficha técnica</b> tem produtor, região, castas, ano, temperatura de serviço… É o que aparece no site.</li><li>Na ficha: <b>Duplicar</b>, <b>Imprimir ficha</b>, <b>Apagar</b> e <b>Guardar</b>.</li><li><b>Gerar códigos em falta</b> dá um código (P0001…) aos produtos sem código. <b>Imprimir tabela</b> imprime a tabela de preços.</li><li><b>Exportar grelha</b> descarrega todos os produtos numa tabela (CSV) que abre no Excel ou Google Sheets. Corrija, acrescente linhas e use <b>Importar grelha</b>: os produtos são atualizados (pelo <b>Código</b>, ou por nome + fornecedor + formato) e as linhas novas viram produtos novos. O que não está no ficheiro não é apagado. As colunas “só leitura” (custo e PVP) são ignoradas. Em “Mostrar no site” escreva Sim ou Não. As datas da promoção escrevem-se AAAA-MM-DD (ou DD/MM/AAAA). O botão <b>Importar grelha</b> também aceita uma <b>cópia completa (.json)</b>: nesse caso pergunta antes, porque substitui tudo.</li><li>Na ficha, em <b>Ficha técnica</b>, pode pôr <b>preço promocional</b>, etiqueta e <b>datas de início e fim</b> para um só produto. Para várias campanhas ao mesmo tempo, use Catálogo / Site → Campanhas.</li><li>Na <b>Ficha técnica</b>, por baixo da foto há o botão <b>✂ Retirar fundo</b>: tira o fundo da imagem (melhor com fundo liso) e permite repor o original.</li></ul>
<h4 data-aj="guias">Guias</h4><ol><li><b>+ Nova guia</b>. Escolha o cliente (ou escreva o nome, NIF e morada).</li><li>Em <b>Artigos</b>, junte produtos e as quantidades. <b>+ Linha livre</b> serve para algo que não está na lista.</li><li>Confirme data, hora, viatura, locais de carga e descarga, pagamento e o número de vias.</li><li>O IVA é o da região de entrega.</li><li>Se o vinho estiver numa <b>campanha a decorrer</b> (Catálogo / Site → Campanhas), entra na guia com o preço de campanha e a indicação 🏷. Pode alterar o preço à mão. Se a campanha já terminou e quer vender a esse preço só nesta guia: no campo <b>Preço de campanha</b>, no topo da guia, escolha “Usar [nome da campanha]”. Os produtos dessa campanha passam ao preço dela (nas linhas já postas e nas novas); as outras guias não mudam. Voltando a “Automático”, regressa ao normal. Também pode prolongar a data de fim da campanha (vale para todos) ou escrever o preço à mão na linha.</li><li>Se levar mais do que há no armazém, a linha mostra <b>⚠ Stock insuficiente</b> (só para produtos com stock registado). Pode guardar na mesma; o stock fica negativo até registar a próxima entrada.</li><li><b>Guardar</b> ou <b>Guardar e imprimir</b>. Uma guia guardada desconta sozinha no stock.</li><li>Numa guia já feita pode <b>Duplicar</b> (para repetir) ou <b>Apagar</b>.</li></ol>
<h4 data-aj="stock">Stock</h4><ul><li>Há dois separadores: <b>📦 Chegou mercadoria</b> (soma ao stock) e <b>🔢 Contagem do armazém</b> (o stock passa a ser o que contou). Escolha primeiro qual.</li><li><b>Chegou mercadoria</b>: escreva o que chegou (caixas e/ou unidades) e a data. A app faz a conta: 5 caixas de 6 + 3 unidades = 33 un.</li><li><b>Oferta (un.)</b>: se o fornecedor ofereceu garrafas (ex.: comprou 100 e ofereceram 6), escreva 100 em Unid. e 6 em Oferta: o stock sobe 106 e o preço de venda mantém-se.</li><li><b>Contagem do armazém</b>: para acertar o stock real, por exemplo a primeira vez. O stock mostra-se em caixas + unidades e, por baixo, o total em unidades.</li><li>Clique no <b>nome do produto</b> para abrir a ficha (preços, ficha técnica, fotografia), sem sair do Stock.</li><li>“Avisar (cx)” é o número de caixas a partir do qual o produto fica a vermelho, “stock baixo”. Cada produto pode ter o seu.</li></ul>
<h4 data-aj="clientes">Clientes</h4><ul><li><b>+ Cliente</b> guarda nome, NIF e morada para não os escrever em cada guia.</li><li>Com dois administradores, os clientes novos de um passam também para o outro (juntam-se, sem repetir nomes ou NIF iguais).</li><li>Se escrever um cliente novo numa guia e <b>Guardar</b>, ele fica logo aqui nos Clientes (sem repetir se o NIF ou o nome já existirem).</li></ul>
<h4 data-aj="fornecedores">Fornecedores</h4><ul><li><b>+ Fornecedor</b>: defina desconto de fábrica, transporte, margem e região de compra. Se mudar aqui, os preços dos produtos que herdam estes valores mudam.</li><li>Um produto pode ter os seus próprios valores na ficha. Esses ganham ao do fornecedor.</li></ul>
<h4 data-aj="financeiro">Financeiro</h4><ol><li>Escolha o <b>período</b> (este mês, mês anterior, trimestre, ano, tudo ou datas à escolha).</li><li>Vê as <b>vendas sem IVA</b>, o <b>lucro estimado</b>, o total com IVA e o número de guias, com a comparação ao período anterior.</li><li>Mais abaixo: vendas por mês, melhores clientes, produtos mais vendidos, por fornecedor e por categoria.</li><li>No fim, o <b>valor do stock</b> no armazém, ao custo e a preço de venda.</li><li>Em <b>Despesas</b>, lance o que a empresa gasta (data, tipo, valor). Os tipos incluem salários, encargos, combustível, seguro e inspeção dos carros… e pode criar novos em “+ Novo tipo”. No campo <b>Funcionário ou viatura</b> escreva o nome ou a matrícula: assim vê quanto custa cada funcionário e cada carro. Vê as despesas por tipo e o <b>resultado estimado</b> (lucro menos despesas).</li><li><b>Exportar vendas</b> e <b>Exportar despesas</b> (CSV) dão as listas do período, para enviar ao contabilista.</li></ol><ul><li>Vendas e lucro vêm das <b>guias guardadas</b>; as despesas são as que você lança. O custo dos vinhos já está no lucro: não lance as compras aos fornecedores. Não inclui pagamentos recebidos, e o lucro é uma estimativa (preço de venda menos custo do produto). Linhas livres não têm custo.</li></ul><h4 data-aj="config">Definições</h4><ul><li><b>Cálculo de preços</b>: como se calcula a margem. Ao mudar o modo, os preços recalculam-se.</li><li><b>Taxas de IVA por região</b> e <b>Guia de entrega</b> (pagamento e texto por omissão).</li><li><b>Avisos de stock</b>: botões para enviar o aviso por WhatsApp, SMS ou e-mail.</li><li><b>Nuvem</b>: partilha os dados entre aparelhos. Sem ela, tudo fica só neste computador.</li><li><b>Guardar automaticamente na Drive</b>: escreva o email do cliente, cole o link do Google e a app copia tudo sozinha depois de cada alteração (e envia uma cópia por email uma vez por dia). Há instruções passo a passo no próprio cartão. “Recuperar da Drive” volta a trazer a última cópia.</li><li><b>Cópia de segurança</b> (no fim da página): <b>Guardar cópia (JSON)</b>, <b>Importar cópia</b> (volta a carregar uma cópia e <b>substitui tudo</b>) e <b>Exportar preços (CSV)</b>. <b>Apagar dados de exemplo</b> limpa os exemplos.</li></ul>
<h4 data-aj="equipa">Equipa (só o administrador)</h4><ul><li>No separador <b>Equipa</b> (só o administrador), escreva o nome e o e-mail do funcionário, escolha as páginas extra e carregue em <b>Criar acesso e gerar link</b>. Envie o link por WhatsApp: o funcionário abre-o, cria a palavra-passe e entra. Todos veem sempre Guias e Stock. Pode mudar as páginas de cada um, <b>Tornar administrador</b> (vê e altera tudo, incluindo custos e a equipa; use só com quem confia totalmente), <b>Passar a funcionário</b>, <b>Desativar</b> (bloqueia, mas guarda) ou <b>Remover</b> (apaga o acesso; um administrador tem primeiro de passar a funcionário). <b>Novo link</b> serve para quem se esqueceu da palavra-passe. Os custos e margens ainda não ficam escondidos aos funcionários que vejam Produtos.</li><li><b>Administrador</b> vê e altera tudo. <b>Funcionário</b> vê só Guias, Stock e as páginas que marcar. Dê a cada pessoa o seu próprio acesso: com um login partilhado não se sabe quem alterou o quê.</li></ul>
<h4 data-aj="dica">Importante</h4><ul><li><b>Versão da aplicação</b>: aparece no topo, ao lado do nome (ex.: “v13 · 16/11/2026”). Depois de atualizar o ficheiro no GitHub, faça Ctrl+F5 e confirme que o número é o novo.</li><li>Sem a nuvem, os dados ficam guardados <b>neste navegador</b>. Faça uma <b>cópia de segurança</b> de vez em quando, sobretudo antes de limpar os dados do Chrome.</li><li>A ajuda do <b>site para clientes</b> está em <b>Catálogo / Site</b>.</li><li><b>Entrada:</b> a app pede sempre e-mail e palavra-passe. Sem entrar, não se vê nada. O botão <b>Sair</b> (no topo) termina a sessão e apaga os dados deste aparelho, depois de enviar para a nuvem o que faltar.</li><li><b>Nuvem:</b> o <b>administrador</b> (o dono) grava produtos e preços; os <b>funcionários</b> emitem guias e o stock fica igual em todos os aparelhos. Quando uma venda faz o stock descer do mínimo, o dono recebe o aviso. Passos de preparação no ficheiro LEIA-ME-nuvem.txt.</li></ul>`;

 if(t==='pct')v=v==null?'':nf(r4(v*100));else if(t==='num')v=v==null?'':nf(v);else v=v??'';

function sel(k,o,opts,{id}={}){const v=val(o,k);return `<select id="${id||'f_'+k.replace(/\./g,'_')}" data-k="${k}" data-t="text">${opts.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`}

 if(el.dataset.t==='pct'||el.dataset.t==='num'){let n=pn(v);if(n==null&&!el.dataset.opt)n=0;if(el.dataset.t==='pct'&&n!=null)n=n/100;v=n}
 setv(cur,el.dataset.k,v);afterInput&&afterInput(el)});

function tiraFundo(src,tol,cb){const im=new Image();im.onload=()=>{const w=im.width,h=im.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,w,h),a=d.data;
 /* cor de fundo = média dos 4 cantos */const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];let R=0,G=0,B=0;cs.forEach(([cx,cy])=>{const i=(cy*w+cx)*4;R+=a[i];G+=a[i+1];B+=a[i+2]});R/=4;G/=4;B/=4;
 const T=tol*tol*3,dist=i=>{const r=a[i]-R,g=a[i+1]-G,b=a[i+2]-B;return r*r+g*g+b*b},m=new Uint8Array(w*h),st=[];
 const push=(px,py)=>{if(px<0||py<0||px>=w||py>=h)return;const k=py*w+px;if(m[k])return;if(dist(k*4)>T)return;m[k]=1;st.push(k)};
 for(let i=0;i<w;i++){push(i,0);push(i,h-1)}for(let j=0;j<h;j++){push(0,j);push(w-1,j)}
 while(st.length){const k=st.pop(),px=k%w,py=(k-px)/w;push(px+1,py);push(px-1,py);push(px,py+1);push(px,py-1)}
 /* limpa o fundo e suaviza a borda */for(let k=0;k<w*h;k++){if(m[k])a[k*4+3]=0}
 const b=new Uint8Array(w*h);for(let py=1;py<h-1;py++)for(let px=1;px<w-1;px++){const k=py*w+px;if(!m[k]&&(m[k-1]||m[k+1]||m[k-w]||m[k+w]))b[k]=1}
 for(let k=0;k<w*h;k++)if(b[k])a[k*4+3]=140;
 x.putImageData(d,0,0);cb(c.toDataURL('image/png'))};im.src=src}
function imgToPng(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)}
function imgToData(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}

function gTotals(G){let gross=0,desc=0;const base={};let custo=0;
 for(const l of G.linhas){const b=l.qt*l.preco,d=b*l.desc;gross+=b;desc+=d;base[l.iva]=(base[l.iva]||0)+(b-d);
  custo+=l.qt*(l.unid==='emb'?(l.embQt||1):1)*(l.custoUn||0)}
 const rates=Object.keys(base).map(Number).sort((a,b)=>b-a).map(r=>({r,base:r2(base[r]),iva:r2(base[r]*r)}));
 const net=r2(gross-desc),iva=rates.reduce((s,x)=>s+x.iva,0);
 return{gross:r2(gross),desc:r2(desc),net,rates,iva:r2(iva),total:r2(net+iva),lucro:r2(net-custo),custo:r2(custo)}}

const GOSTOS_SQL=`-- Gostos dos visitantes (Preços e Guias / catálogo online)
-- Executar uma vez no SQL Editor do Supabase da empresa.
create table if not exists public.gostos (
  produto text primary key check (length(produto) <= 64),
  total integer not null default 0 check (total >= 0),
  atualizado timestamptz not null default now()
);
alter table public.gostos enable row level security;
drop policy if exists "ler gostos" on public.gostos;
create policy "ler gostos" on public.gostos for select to anon using (true);

create or replace function public.gosto(p_produto text, p_delta integer)
returns integer language plpgsql security definer set search_path = public as $fn$
declare t integer;
begin
  if p_delta not in (1, -1) or p_produto is null or length(p_produto) > 64 then
    raise exception 'pedido inválido';
  end if;
  insert into public.gostos (produto, total) values (p_produto, greatest(p_delta, 0))
  on conflict (produto) do update
    set total = greatest(public.gostos.total + p_delta, 0), atualizado = now()
  returning total into t;
  return t;
end $fn$;
revoke all on function public.gosto(text, integer) from public;
grant execute on function public.gosto(text, integer) to anon;
`;

 m.innerHTML=`<h2>Catálogo / Site </h2><p class="sub" style="margin:-6px 0 6px"><b>É a página que os clientes veem.</b> Aqui escolhe o que aparece no site.</p><p class="sub">Gera uma página web com os seus produtos e fichas técnicas para mostrar aos clientes. Nunca inclui custos, descontos de fábrica, transporte nem margens.</p>
 <button class="aj-fab" type="button" aria-label="Ajuda do site" title="Ajuda do site" onclick="document.getElementById('ajPan').classList.toggle('on')">?</button><div class="aj-pan" id="ajPan"><div class="aj-hd"><b>📖 Ajuda do site — passo a passo</b><button type="button" class="btn sm" onclick="document.getElementById('ajPan').classList.remove('on')" aria-label="Fechar">✕</button></div>
  <div class="aj-b">
  <p class="sub">Esta ajuda é só do <b>site para clientes</b>. A ajuda geral da aplicação (produtos, guias, stock…) está no botão <b>?</b> dos outros separadores.</p>
  <h4>Como funciona, em resumo</h4>
  <ol><li>Os produtos e preços vêm do separador <b>Produtos</b>. O site nunca mostra custos, descontos de fábrica, transporte nem margens.</li>
  <li>Aqui, em <b>Catálogo / Site</b>, escolhe o que aparece e como fica. A página está ordenada pelo uso diário: 1 Produtos, 2 Destaques, 3 Campanhas, 4 Cabazes; depois, o que se configura uma vez (5 Textos e aspeto), 6 Castas e 7 Gostos.</li>
  <li>Carregue em <b>Gerar página (ficheiro)</b>: descarrega o ficheiro <b>index.html</b>. É esse o site.</li>
  <li>Os preços ficam fixos no momento em que gera. <b>Sempre que mudar preços, destaques ou cabazes, gere outra vez</b> e substitua o ficheiro antigo.</li>
  <li><b>Atualizar o site sem gerar outro ficheiro</b>: depois de ligar o site à base de dados (uma vez), carregue em <b>☁ Publicar alterações no site</b> (no topo desta página). Envia preços, produtos, textos, imagens e destaques. Só o administrador, com sessão iniciada, pode. Só se mudar a estrutura do site (uma versão nova da app) é preciso gerar outro <b>index.html</b>.</li></ol>

  <h4>Antes de começar (uma vez)</h4>
  <ol><li>Em <b>Definições → Empresa</b>: nome, logótipo e <b>telefone</b>. O telefone é o número do botão verde do WhatsApp no site (sem telefone, o botão não aparece).</li>
  <li>Em <b>Produtos</b>: confirme nome, formato, preço e, na ficha, a <b>foto</b>, produtor, região, castas e descrição.</li></ol>

  <h4>1. Textos da página</h4>
  <ol><li><b>Título</b> e <b>Subtítulo</b>: aparecem no topo e na capa (ex.: “Vinhos Trindade” / “Vinhos e Azeites”).</li>
  <li><b>Título grande da capa</b>: o texto grande da capa. Se ficar vazio, aparece “Os nossos vinhos” (ou “Os nossos produtos”). O <b>Texto de apresentação</b> aparece por baixo.</li>
  <li><b>Texto de apresentação</b>: a frase por baixo do título da capa.</li>
  <li><b>Aviso junto aos preços</b>: ex.: “Preços sujeitos a alteração”.</li>
  <li><b>Categorias de vinho</b>: a ordem em que aparecem (Tinto, Branco, Rosé, Espumante).</li>
  <li><b>Vantagens</b>: uma por linha, até 4 (ex.: “Entrega na Madeira”).</li></ol>

  <h4>2. Preços</h4>
  <ol><li><b>Preços, por omissão</b>: <i>Visíveis</i> mostra todos; <i>Ocultos</i> mostra “Preço sob consulta”.</li>
  <li><b>Preço mostrado</b>: com ou sem IVA. <b>IVA da região</b>: Madeira, Continente ou Açores.</li>
  <li>Para um produto em particular, na tabela “Produtos no catálogo” use a coluna <b>Mostrar preço</b> (Mostrar / Ocultar / Seguir geral).</li></ol>

  <h4>3. Que produtos aparecem</h4>
  <ol><li>Na tabela “Produtos no catálogo”, a coluna <b>Publicar</b>: só aparecem os produtos que marcou com <b>+ Catálogo</b> na página Produtos. Aqui pode ainda retirar um.</li><li><b>Cores e imagens</b> (secção 5): pode pôr uma cor, uma imagem ou as duas no fundo da foto do cartão, no fundo do texto do cartão e no fundo de todo o site, além do banner da capa. Depois carregue em <b>☁ Publicar alterações no site</b>.</li>
  <li>Em <b>Foto / ficha</b> abre a ficha do produto, onde carrega a foto e pode usar <b>✂ Retirar fundo</b>.</li></ol>

  <h4>4. Aspeto</h4>
  <ol><li><b>Fundo da capa</b>: Aurora, Ondas, Vinha ou <b>Imagem</b>. Com “Imagem”, carregue a sua foto em <b>Imagem de fundo</b> (tamanho ideal 2400 × 1270 px; deixe o lado esquerdo mais calmo, porque é onde fica o texto).</li>
  <li><b>Letra do título</b>: fina, clássica ou manuscrita.</li>
  <li><b>Fundo atrás dos produtos</b>: escolha um dos prontos ou “A minha imagem…” (ideal 800 × 860 px). Aparece na zona das descrições dos cartões e na moldura da capa.</li>
  <li><b>Confirmação de idade</b>: ligada, o visitante confirma que tem 18 anos ao abrir.</li></ol>

  <h4>5. Destaques (os produtos a mostrar primeiro)</h4>
  <ol><li>Em <b>Linhas de destaque</b> carregue em <b>+ Nova linha de destaque</b>.</li>
  <li>Escreva o <b>título</b> (ex.: “Em destaque”, “Novidades”, “Black Friday”).</li>
  <li>Em <b>+ Adicionar produto a esta linha…</b> escolha os produtos (3, 4, 6… os que quiser). Use ▲ ▼ para a ordem e ✕ para retirar.</li>
  <li><b>Promoção ou campanha</b> (atalho): debaixo de cada produto da linha há dois campos. <b>A promoção não depende do destaque</b>: qualquer produto do catálogo pode ter promoção (ver o passo 8). Aqui é só um atalho. Em <b>Preço promocional</b> escreva o preço (ex.: 4,90) e, se quiser, em <b>Etiqueta</b> o texto da campanha (ex.: “Black Friday”). Fica logo guardado na ficha do produto.</li>
  <li><b>Mostrar no site</b>: ligue ou desligue a linha. Desligada, os produtos ficam guardados para outra altura.</li>
  <li>Pode ter várias linhas; a de cima aparece primeiro.</li>
  <li>No site, os destaques aparecem no botão <b>“Novidades e destaques”</b>, ao lado das categorias. O visitante carrega e abre por baixo o que estiver ligado. <b>Se não houver nenhum destaque nem cabazes ligados, o botão desaparece sozinho.</b></li></ol>

  <h4>6. Capa do site (imagem grande com os destaques)</h4>
  <ol><li>A capa mostra em <b>slide todos os produtos da primeira linha de destaque ligada</b> (até 10). <b>Os produtos em promoção vêm primeiro</b>, do maior para o menor desconto (%), e depois os restantes. Se não houver promoções, abre num produto à sorte.</li>
  <li>Se um produto tem promoção, a capa mostra o <b>nome da promoção num selo vermelho no canto da foto</b> (mesmo em “Só a imagem”) e, em “Mostrar nome, preço e descrição”, o preço antigo riscado e o novo.</li>
  <li>Em <b>Destaque da capa do site</b>: <i>Só a imagem</i> ou <i>Mostrar nome, preço e descrição</i>. Com o texto ligado pode <b>escrever o nome, o preço e a descrição</b> de cada um (ex.: “Cabaz de Natal / desde 39,90 € / …”); vazio = usa o do produto.</li>
  <li><b>Destaques por baixo da capa</b>: <i>Em cortina</i> (abrem ao carregar no botão) ou <i>Sempre visíveis</i>.</li>
  <li><b>Texto da barra</b>: o texto do botão dos destaques (ex.: “Novidades e destaques”). Pode mudar quando quiser.</li></ol>

  <h4>7. Cabazes (ex.: Natal, Páscoa)</h4>
  <ol><li>Em <b>Cabazes</b>, escreva o <b>título</b> (ex.: “Cabazes de Natal”). É o título que aparece quando o visitante abre os destaques.</li>
  <li><b>+ Novo cabaz</b>: nome, preço (ex.: “49,90 €”), o que inclui, e a <b>foto</b> (carregue um ficheiro ou cole um link de imagem). Prefira ficheiro: alguns links deixam de funcionar.</li>
  <li>▲ ▼ mudam a ordem; <b>Apagar</b> pede confirmação.</li>
  <li><b>Destaque: mostrar os cabazes no site</b>: ligado, os cabazes aparecem; desligado, <b>não aparecem nem o título</b>.</li>
  <li>No site, ao carregar num cabaz abre a imagem em grande com preço e descrição.</li>
  <li>Mudar de época: altere o título, os cabazes e as fotos. Se só quer pôr de lado, desligue o destaque.</li>
  <li><b>Carregar 3 cabazes de exemplo</b> serve só para teste.</li></ol>

  <h4>8. Promoção “Antes / Agora” (ex.: Black Friday)</h4>
  <ol><li><b>Qualquer produto</b> pode ter promoção, esteja ou não num destaque. Em <b>Produtos</b> → abrir o produto → separador <b>Ficha técnica</b> → <b>Preço promocional no site</b>. Também pode preencher no destaque (passo 5): é o mesmo campo.</li>
  <li>O preço promocional tem de ser <b>mais baixo</b> que o normal; se for igual ou mais alto, a promoção não aparece.</li>
  <li>Na ficha pode pôr <b>início</b> e <b>fim</b> da promoção (opcional). Sem datas fica sempre ligada. Com datas, só vale entre elas e depois o site volta ao preço normal sozinho.</li>
  <li>Escreva o preço promocional como o site mostra o preço (com ou sem IVA).</li>
  <li><b>Etiqueta da promoção</b>: o texto da etiqueta vermelha (ex.: “Black Friday”, “Natal”, “-20%”). Vazio = “Promoção”.</li>
  <li>No site aparece: <b>Antes ~~5,16 €~~ AGORA 4,90 €</b>. Aparece na lista de produtos (etiqueta no canto da foto), na linha de destaque e na capa (se o produto estiver lá). Só nos produtos onde preencheu. Para acabar a promoção, apague o preço promocional e gere de novo.</li>
  <li>Para vários produtos, ou para datas de início e fim, use <b>Campanhas e promoções</b> (passo 8-B).</li><li>Se os preços estiverem ocultos, a promoção também fica oculta.</li></ol>

  <h4>8-B. Campanhas e promoções (datas, vários produtos)</h4>
  <ol><li>Em Catálogo / Site, no cartão <b>Campanhas e promoções</b>, carregue em <b>+ Nova campanha</b>.</li>
  <li>Escreva o <b>nome</b> (é a etiqueta vermelha, ex.: “Black Friday”), o <b>desconto %</b>, o <b>início</b> e o <b>fim</b> (último dia).</li>
  <li>Junte os produtos: um <b>grupo</b> (todos, só vinhos, um tipo, fornecedor ou casta) ou um <b>produto</b>. Pode ser só um vinho.</li>
  <li>Se um produto tiver outro preço, escreva-o em <b>preço próprio</b> (o preço final, como aparece no site).</li>
  <li>Cada campanha mostra o estado: <b>Agendada</b>, <b>A decorrer</b> ou <b>Terminada</b>. Pode deixá-la <b>desligada</b>.</li>
  <li>Gere o site e publique. <b>No dia a seguir ao fim, o site volta ao preço normal sozinho</b>, sem gerar outra vez. Uma campanha agendada também só começa na data certa.</li>
  <li>Nas <b>Guias</b>: se o vinho estiver numa campanha a decorrer, entra na guia com o preço de campanha (com a indicação 🏷 Campanha). Pode sempre alterar o preço à mão. Guias já feitas não mudam.</li></ol>

  <h4>9. Preço por caixa</h4>
  <ol><li>Na ficha do produto, preencha <b>Caixa: nº de unidades</b> (ex.: 6) e <b>Caixa: preço da caixa</b> (ex.: 27,50).</li>
  <li>No site aparece: <b>Caixa de 6: 27,50 € (4,58 € / un.)</b>. O preço por unidade é calculado. Tem de preencher as duas; vazio = não aparece.</li></ol>

  <h4>10. Castas</h4>
  <ol><li>Em <b>Castas</b>, escreva a descrição de cada casta (ou use “Adicionar castas portuguesas comuns”). Quando o nome aparece no campo “Castas” do produto, a descrição entra na ficha do produto no site.</li></ol>

  <h4>11. Pré-visualizar e gerar</h4>
  <ol><li><b>Pré-visualizar</b>: vê o site numa janela, sem descarregar nada.</li>
  <li><b>Gerar página (ficheiro)</b>: descarrega <b>index.html</b>. Abra-o no browser para confirmar e depois ponha-o online (ver o passo 12).</li>
  <li>As fotos de produto aparecem se estiverem guardadas na ficha. Fotos por link precisam de internet.</li>
  <li><b>Retirar o fundo da foto</b>: na ficha do produto, depois de carregar a foto, carregue em <b>✂ Retirar fundo</b> (por baixo da foto). Funciona melhor com fundo liso. Se ficar mal, ajuste a <b>Sensibilidade</b> ou carregue em <b>Repor fundo original</b>.</li></ol>
  <h4>12. Pôr o site online (GitHub) e atualizá-lo</h4>
  <ol><li>O catálogo está em <b>https://ttsvinhos.github.io/catalogo/</b>, na conta GitHub da empresa. Abra <b>https://github.com/ttsvinhos/catalogo/upload/main</b>.</li>
  <li>Arraste o ficheiro <b>index.html</b> acabado de gerar e carregue em <b>Commit changes</b>. Substitui o antigo. Passado 1 a 2 minutos o site está atualizado (se ainda vir o antigo, carregue em Ctrl+F5).</li>
  <li>Sempre que mudar produtos, preços, destaques ou promoções: gere outra vez e envie o novo <b>index.html</b>. Se o descarregamento vier com outro nome (por exemplo, <b>index (1).html</b>), mude-lhe o nome para <b>index.html</b> antes de enviar.</li>
  <li>Esta é a <b>página pública</b>: nunca envie para este endereço o ficheiro da aplicação (<b>precos-e-guias.html</b>). A aplicação tem o seu próprio endereço, com login: <b>https://ttsvinhos.github.io/gestao/precos-e-guias.html</b>.</li></ol>

  <h4>12. Gostos dos visitantes (opcional, só com o site online)</h4>
  <ol><li>Sem base de dados online, o coração só guarda os favoritos no browser de cada visitante.</li>
  <li>Para contar os gostos de todos, ligue ao Supabase da empresa: cole o <b>endereço</b> e a <b>chave pública</b>, descarregue o <b>SQL</b> e corra-o uma vez no Supabase, e use <b>Testar ligação</b>. Nunca use a chave “secret” / “service role”.</li>
  <li>Quando o site for para o ar, convém seguir a lista de verificação do Supabase para não falhar nada.</li></ol>

  <h4>Rotina rápida (ex.: lançar a Black Friday)</h4>
  <ol><li>Catálogo / Site → crie ou ligue a linha de destaque “Black Friday”, ponha-a em cima e adicione os produtos.</li>
  <li>Em cada produto da linha, preencha o <b>preço promocional</b> e a <b>etiqueta</b>. Para muitos produtos ou com datas, use <b>Campanhas e promoções</b> (ex.: 15% em todos os tintos até ao dia 30).</li>
  <li><b>Pré-visualizar</b>. Se estiver bem, <b>Gerar página (ficheiro)</b> e substitua o ficheiro online.</li>
  <li>No fim da campanha: se usou <b>Campanhas</b> com datas, não é preciso fazer nada (o site volta ao preço normal sozinho). Se pôs preços promocionais à mão sem datas, apague-os, desligue a linha e gere de novo.</li></ol>

  <h4>Se algo não aparece</h4>
  <ul><li><b>Não aparece o botão “Novidades e destaques”</b>: não há nenhuma linha de destaque ligada com produtos, nem cabazes ligados.</li>
  <li><b>Não aparecem preços</b>: “Preços, por omissão” está em Ocultos, ou o produto está em “Ocultar”.</li>
  <li><b>Mudei e o site não mudou</b>: tem de <b>gerar outra vez</b> e usar o ficheiro novo (veja o nome na pasta Transferências).</li>
  <li><b>Falta o botão do WhatsApp</b>: falta o telefone em Definições → Empresa.</li>
  <li><b>Imagem de cabaz vazia</b>: o link deixou de funcionar; carregue a foto como ficheiro.</li>
  <li><b>Um produto não aparece</b>: confirme a coluna “Publicar” na tabela.</li></ul>

 const q=x=>{x=String(x==null?'':x);if(/^[+\-=@]/.test(x)&&!/^-?\d+([.,]\d+)?$/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""').replace(/^(-?\d+)\.(\d+)$/,'$1,$2')+'"'};

function csvParse(t){t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';const d=first.split(';').length>=first.split(',').length&&first.includes(';')?';':(first.includes('\t')?'\t':',');const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))out.push(row);row=[]}else cur+=c}row.push(cur);if(row.some(x=>x.trim()!==''))out.push(row);return out}
function pnx(v){v=String(v==null?'':v).replace(/[€%\s]/g,'');if(v==='')return null;if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'');const x=parseFloat(v.replace(',','.'));return isNaN(x)?null:x}

  if(/^\s*\{/.test(txt)){let d;try{d=JSON.parse(txt)}catch(e){toast('Ficheiro inválido');return}if(!d||!d.set||!Array.isArray(d.prod)||!Array.isArray(d.forn)){toast('Este .json não é uma cópia desta aplicação');return}
   if(!confirm('Este ficheiro é uma CÓPIA COMPLETA ('+d.prod.length+' produtos, '+d.forn.length+' fornecedores).\nImportar SUBSTITUI tudo o que está agora na aplicação (produtos, guias, clientes, definições).\n\nContinuar?'))return;
   const b=blank();d.set={...b.set,...d.set,empresa:{...b.set.empresa,...(d.set.empresa||{})},cat:{...b.set.cat,...(d.set.cat||{})}};d.cli=d.cli||[];d.guias=d.guias||[];d.castas=d.castas||[];d.exemplo=!!d.exemplo;migrate(d);DB=d;save();render();toast('Cópia importada: '+d.prod.length+' produtos');return}const R=csvParse(txt);if(R.length<2)throw new Error('Ficheiro vazio');
  const H=R[0].map(x=>norm(x)),idx={};GRID_COLS.forEach(c=>{const i=H.indexOf(norm(c[0]));if(i>=0)idx[c[1]]=i});
  if(idx.nome==null&&idx.ref==null)throw new Error('Não encontrei as colunas "Código" ou "Produto". Use a grelha exportada pela aplicação.');
  const g=(r,k)=>idx[k]==null?undefined:String(r[idx[k]]==null?'':r[idx[k]]).trim();
  let nUp=0,nNew=0,nSkip=0;const newForn=new Set(),plan=[],used=new Set();
  R.slice(1).forEach(r=>{const ref=g(r,'ref')||'',nome=g(r,'nome')||'';if(!ref&&!nome){nSkip++;return}
   const fn=g(r,'forn');let p=ref?DB.prod.find(x=>norm(x.ref)===norm(ref)&&!used.has(x.id)):null;
   if(!p&&nome)p=DB.prod.find(x=>!used.has(x.id)&&!norm(x.ref)&&norm(x.nome)===norm(nome)&&(g(r,'forn')==null||!fn||norm(fornNome(x.fornId))===norm(fn))&&(g(r,'formato')==null||norm(x.formato)===norm(g(r,'formato')))&&(g(r,'categoria')==null||norm(x.categoria)===norm(g(r,'categoria'))));
   if(p)used.add(p.id);

  if(!plan.length){toast('Nenhuma linha válida no ficheiro');return}
  if(!confirm('Importar grelha:\n• '+nUp+' produto(s) atualizado(s)\n• '+nNew+' produto(s) novo(s)'+(newForn.size?'\n• '+newForn.size+' fornecedor(es) novo(s): '+[...newForn].join(', '):'')+(nSkip?'\n• '+nSkip+' linha(s) vazia(s) ignorada(s)':'')+'\n\nOs produtos que não estão no ficheiro ficam como estão. Continuar?'))return;
  plan.forEach(({r,p,ref,nome})=>{
   if(!p){p={id:uid(),ref:ref,nome:nome,categoria:'',formato:'',fornId:(DB.forn[0]||{}).id||'',tabela:0,desc:null,bonusN:0,bonusM:0,transp:null,margem:null,iva:null,pvpFixo:null,embNome:'Cx',embQt:6,ficha:{},extras:[]};DB.prod.push(p)}
   if(!p.ficha)p.ficha={};

   if(has('ref'))p.ref=T('ref');if(has('nome')&&T('nome'))p.nome=T('nome');if(has('categoria'))p.categoria=T('categoria');if(has('formato'))p.formato=T('formato');

   const num=(k,fn)=>{if(has(k)){const x=pnx(T(k));fn(x)}};
   num('tabela',x=>{if(x!=null)p.tabela=x});num('desc',x=>p.desc=x==null?null:x/100);num('bonusN',x=>p.bonusN=x||0);num('bonusM',x=>p.bonusM=x||0);num('transp',x=>p.transp=x);num('margem',x=>p.margem=x==null?null:x/100);num('pvpFixo',x=>p.pvpFixo=x);num('iva',x=>p.iva=x==null?null:x/100);num('embQt',x=>{if(x!=null)p.embQt=x});

  migrate(DB);save();render();toast('Grelha importada: '+nUp+' atualizados, '+nNew+' novos')}catch(e){toast('Não consegui importar: '+(e.message||'ficheiro inválido'))}};fr.readAsArrayBuffer(file)}

function bkTxt(){const h=t=>t?new Date(t).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';if(bkBusy)return '⏳ A guardar na Drive…';if(bkSt.err)return '⚠️ '+esc(bkSt.err)+(bkSt.ok?' (última cópia certa: '+h(bkSt.ok)+')':'');return bkSt.ok?'✅ Última cópia na Drive: <b>'+h(bkSt.ok)+'</b>':'Ainda sem cópias nesta aplicação.'}

const hojeS=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const campCfg=()=>{const S=DB.set;if(!Array.isArray(S.camps))S.camps=[];return S.camps};
function campEst(c,d){d=d||hojeS();if(c.ativo===false)return'off';if(c.de&&d<c.de)return'agendada';if(c.ate&&d>c.ate)return'terminada';return'decorrer'}
function campPreco(p,c,it){const b=pmBase(p);if(!b)return null;const o=pnx(it&&it.preco);if(o&&o>0)return r2(o);const pc=parseFloat(String(c.pct).replace(',','.'));return pc>0&&pc<100?r2(b*(1-pc/100)):null}
function campForce(p,id){const c=campCfg().find(x=>x.id===id);if(!c)return null;const it=(c.itens||[]).find(x=>x.id===p.id);if(!it)return null;const pr=campPreco(p,c,it),b=pmBase(p);return pr!=null&&b&&pr<b?{c:c,pr:pr,b:b}:null}
function campDe(p,d){let best=null;campCfg().forEach(c=>{if(campEst(c,d)!=='decorrer')return;const it=(c.itens||[]).find(x=>x.id===p.id);if(!it)return;const pr=campPreco(p,c,it),b=pmBase(p);if(pr!=null&&b&&pr<b&&(!best||pr<best.pr))best={c:c,pr:pr,b:b}});return best}
function pmList(p){const f=p.ficha||{},out=[];const t=String(f.promo||'').trim();if(t){const n=parseFloat(t.indexOf(',')>=0?t.replace(/\./g,'').replace(',','.'):t);if(isFinite(n)&&n>0)out.push({pr:n,pt:String(f.promoTxt||'').trim(),de:f.promoDe||'',a:f.promoAte||''})}
 campCfg().forEach(c=>{if(c.ativo===false)return;const it=(c.itens||[]).find(x=>x.id===p.id);if(!it)return;const pr=campPreco(p,c,it);if(pr!=null)out.push({pr:pr,pt:String(c.nome||'').trim(),de:c.de||'',a:c.ate||''})});return out}
const CAMP_EST={off:['Desligada','#8a8a8a'],agendada:['Agendada','#b9770e'],terminada:['Terminada','#8a8a8a'],decorrer:['A decorrer','#1e8449']};
function campSum(c){const E=CAMP_EST[campEst(c)],open=!!(ui.campOpen||{})[c.id];return `<b style="flex:1">${open?'▾':'▸'} ${esc(c.nome||'Campanha sem nome')}</b><span class="sub">${esc(c.de||'sem início')} → ${esc(c.ate||'sem fim')} · ${(c.itens||[]).length} produto(s)</span><span style="font-weight:700;color:${E[1]}">${E[0]}</span>`}
function campOne(c){const open=!!(ui.campOpen||{})[c.id];const its=c.itens||[];
 const rows=its.map(it=>{const p=DB.prod.find(x=>x.id===it.id);if(!p)return'';const b=pmBase(p),pr=campPreco(p,c,it);return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)"><span style="flex:1 1 200px"><b>${esc(p.nome)}</b> <span class="sub">${esc(p.formato||'')}</span></span><span class="sub">${b?nf(b)+' €':'sem preço'}</span><span>→ <b data-cpr="${c.id}|${p.id}">${pr!=null?nf(pr)+' €':'—'}</b></span><input data-cit="${c.id}|${p.id}" value="${esc(it.preco||'')}" placeholder="preço próprio" aria-label="Preço próprio da campanha" style="width:110px"><button class="btn sm" data-crm="${c.id}|${p.id}" aria-label="Retirar da campanha">✕</button></div>`}).join('');
 return `<div style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px"><div data-csum="${c.id}" style="cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${campSum(c)}</div>
 ${open?`<div style="margin-top:10px"><div class="grid w2"><label>Nome da campanha (etiqueta no site)<input data-cf="${c.id}|nome" value="${esc(c.nome||'')}" placeholder="ex.: Black Friday"></label><label>Desconto (%) para todos os produtos<input data-cf="${c.id}|pct" inputmode="decimal" value="${esc(c.pct||'')}" placeholder="ex.: 15"></label><label>Início<input type="date" data-cf="${c.id}|de" value="${esc(c.de||'')}"></label><label>Fim (último dia)<input type="date" data-cf="${c.id}|ate" value="${esc(c.ate||'')}"></label></div>
 <label style="display:flex;flex-direction:row;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" data-cf="${c.id}|ativo" ${c.ativo===false?'':'checked'} style="width:auto"> Campanha ligada</label>
 <div class="grid w2"><label>Juntar um grupo<select data-cgrp="${c.id}"><option value="">Escolher grupo…</option>${pmOpts()}</select></label><label>Juntar um produto<select data-cprod="${c.id}"><option value="">Escolher produto…</option>${DB.prod.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${esc(p.nome)} ${esc(p.formato||'')}</option>`).join('')}</select></label></div>
 <div style="margin-top:6px">${rows||'<div class="sub">Ainda sem produtos. Junte um grupo ou um produto.</div>'}</div>
 <div class="bar" style="margin:10px 0 0"><button class="btn danger" data-cdel="${c.id}">Apagar campanha</button></div></div>`:''}</div>`}
function campInner(){const L=campCfg();return `<h3 style="margin-bottom:6px">🏷️ Campanhas e promoções</h3><p class="sub" style="margin-top:0">Crie uma campanha com nome, datas e produtos. Durante a campanha o site mostra o preço de campanha ("Antes / Agora") e a guia também o usa. No dia a seguir ao fim, tudo volta sozinho ao preço normal, sem ser preciso gerar o site outra vez. Pode ter várias campanhas, e uma só pode ter um único vinho. Preço “próprio” = o preço final de um produto, como aparece no site.</p>${L.map(campOne).join('')}<div class="bar" style="margin:12px 0 0"><button class="btn pri" id="campNew">+ Nova campanha</button></div>`}
function campBind(card){
 const re=()=>{card.innerHTML=campInner()};const C=id=>campCfg().find(c=>c.id===id);
 card.onclick=e=>{const t=e.target;let b;
  if(b=t.closest('[data-csum]')){ui.campOpen=ui.campOpen||{};const id=b.dataset.csum;ui.campOpen[id]=!ui.campOpen[id];re();return}
  if(t.id==='campNew'){const c={id:uid(),nome:'',de:'',ate:'',pct:'',ativo:true,itens:[]};campCfg().push(c);ui.campOpen=ui.campOpen||{};ui.campOpen[c.id]=true;save();re();return}
  if(b=t.closest('[data-crm]')){const[id,pid]=b.dataset.crm.split('|'),c=C(id);c.itens=c.itens.filter(x=>x.id!==pid);save();re();return}
  if(b=t.closest('[data-cdel]')){const c=C(b.dataset.cdel);if(confirm('Apagar a campanha "'+(c.nome||'sem nome')+'"? Os produtos voltam ao preço normal.')){DB.set.camps=campCfg().filter(x=>x.id!==c.id);save();re()}return}};
 card.oninput=e=>{const t=e.target;if(t.dataset.cf){const[id,k]=t.dataset.cf.split('|'),c=C(id);if(!c)return;if(k==='ativo')c.ativo=t.checked;else c[k]=t.value;save()}
  else if(t.dataset.cit){const[id,pid]=t.dataset.cit.split('|'),c=C(id),it=c&&c.itens.find(x=>x.id===pid);if(it){it.preco=t.value;save()}}};
 card.onchange=e=>{const t=e.target;
  if(t.dataset.cf){const id=t.dataset.cf.split('|')[0],c=C(id),sm=card.querySelector('[data-csum="'+id+'"]');if(sm)sm.innerHTML=campSum(c);card.querySelectorAll('[data-cpr^="'+id+'|"]').forEach(el=>{const pid=el.dataset.cpr.split('|')[1],p=DB.prod.find(x=>x.id===pid),it=c.itens.find(x=>x.id===pid),pr=p&&campPreco(p,c,it);el.textContent=pr!=null?nf(pr)+' €':'—'});return}
  if(t.dataset.cit){const[id,pid]=t.dataset.cit.split('|'),c=C(id),p=DB.prod.find(x=>x.id===pid),it=c.itens.find(x=>x.id===pid),pr=campPreco(p,c,it),el=card.querySelector('[data-cpr="'+id+'|'+pid+'"]');if(el)el.textContent=pr!=null?nf(pr)+' €':'—';return}
  if(t.dataset.cgrp&&t.value){const c=C(t.dataset.cgrp);let n=0;DB.prod.filter(p=>pmMatch(p,t.value)&&pmBase(p)).forEach(p=>{if(!c.itens.some(x=>x.id===p.id)){c.itens.push({id:p.id,preco:''});n++}});save();re();toast(n+' produto(s) juntado(s)');return}
  if(t.dataset.cprod&&t.value){const c=C(t.dataset.cprod);if(!c.itens.some(x=>x.id===t.value))c.itens.push({id:t.value,preco:''});save();re()}};
}
function bkSoon(){const c=DB.set.bk;if(!c||!c.auto||!c.url)return;clearTimeout(bkT);bkT=setTimeout(()=>bkSend(false),8000)}
async function bkSend(manual){const c=bkCfg();if(!/^https:\/\/script\.google\.com\//.test(c.url||'')){if(manual)toast('Cole primeiro o link do Google (começa por https://script.google.com/…)');return}
 if(bkBusy)return;bkBusy=true;bkMsg({err:''});
 try{const antes=await bkPing();
  await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({email:c.email||'',dados:DB})});
  let ok=false;for(let i=0;i<6&&!ok;i++){await new Promise(r=>setTimeout(r,2500));const u=await bkPing();if(u&&u!==antes)ok=true}
  bkBusy=false;if(ok){bkMsg({ok:new Date().toISOString(),err:''});if(manual)toast('Guardado na Drive')}else{bkMsg({err:'Enviei, mas a Drive não confirmou. Verifique o link e as permissões ("Qualquer pessoa").'});if(manual)toast('A Drive não confirmou')}
 }catch(e){bkBusy=false;bkMsg({err:'Sem ligação à Drive agora. Tenta outra vez mais tarde.'})}}
async function bkPing(){try{const r=await fetch(bkCfg().url+(bkCfg().url.includes('?')?'&':'?')+'t='+Date.now());const j=await r.json();return j&&j.ultima||''}catch(e){return null}}
async function bkTest(){const c=bkCfg();if(!/^https:\/\/script\.google\.com\//.test(c.url||'')){toast('Cole primeiro o link do Google');return}
 try{const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'t='+Date.now());const j=await r.json();if(j&&j.ok){toast('Ligação certa'+(j.ultima?' · última cópia '+new Date(j.ultima).toLocaleString('pt-PT'):' · ainda sem cópias'))}else toast('O link respondeu, mas não parece o script certo')}catch(e){toast('Não consegui ligar. Confirme o link e se está publicado para "Qualquer pessoa".')}}
async function bkRestore(){const c=bkCfg();if(!c.url){toast('Cole primeiro o link do Google');return}
 try{const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'dados=1&t='+Date.now());const d=await r.json();if(!d||!d.set||!Array.isArray(d.prod)||!Array.isArray(d.forn)){toast('Ainda não há nenhuma cópia na Drive');return}
  if(!confirm('Recuperar a cópia da Drive?\nIsto SUBSTITUI tudo o que está agora nesta aplicação ('+d.prod.length+' produtos na cópia).'))return;
  const b=blank();d.set={...b.set,...d.set,empresa:{...b.set.empresa,...(d.set.empresa||{})},cat:{...b.set.cat,...(d.set.cat||{})}};d.cli=d.cli||[];d.guias=d.guias||[];d.castas=d.castas||[];d.exemplo=!!d.exemplo;migrate(d);DB=d;save();toast('Cópia recuperada da Drive');render()}catch(e){toast('Não consegui ler a cópia da Drive')}}
function download(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function doPrint(html){const P=$('#print');P.innerHTML=html;
 /* espera que as imagens (logótipo) estejam carregadas e limpa depois de imprimir */
 const imgs=[...P.querySelectorAll('img')].filter(i=>!i.complete);
 const go=()=>setTimeout(()=>{try{window.print()}catch(e){toast('Abra a app num navegador para imprimir')}},120);
 if(!imgs.length)return go();let n=imgs.length;const ok=()=>{if(--n<=0)go()};imgs.forEach(i=>{i.onload=i.onerror=ok});setTimeout(()=>{if(n>0){n=0;go()}},1500)}

function mostraDefinirSenha(c){
 document.body.classList.add('gated');
 let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
 g.innerHTML=`<form class="gbox" id="gForm"><h1>Criar palavra-passe</h1><p class="sub">Escolha uma palavra-passe com pelo menos 8 caracteres. Depois entra sempre com o seu e-mail e esta palavra-passe.</p>
 <label>Palavra-passe<input id="gP1" type="password" autocomplete="new-password" minlength="8" required></label>
 <label>Repetir palavra-passe<input id="gP2" type="password" autocomplete="new-password" minlength="8" required></label>
 <button class="btn pri" id="gBt" type="submit">Guardar e entrar</button><div class="sub" id="gSt" role="status"></div></form>`;
 document.getElementById('gForm').onsubmit=async ev=>{ev.preventDefault();const st=document.getElementById('gSt'),bt=document.getElementById('gBt');
  const a=document.getElementById('gP1').value,b=document.getElementById('gP2').value;
  if(a!==b){st.textContent='As duas palavras-passe têm de ser iguais.';return}
  if(a.length<8){st.textContent='Use pelo menos 8 caracteres.';return}
  bt.disabled=true;st.textContent='A guardar…';
  try{const{u,k}=nvCfg();
   const r=await fetch(u+'/auth/v1/user',{method:'PUT',headers:{apikey:k,Authorization:'Bearer '+c.at,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
   if(!r.ok)throw new Error('Não foi possível guardar. O link pode ter expirado: peça um novo ao dono.');
   const j=await r.json();
   NV={sess:{at:c.at,rt:c.rt,exp:Date.now()+c.exp*1000,email:j.email||''},h:{},mvh:{},dv:0,dh:null};nvSave();
   history.replaceState(null,'',location.pathname+location.search);
   const p=await nvReq('perfis?select=papel,paginas,ativo');
   if(!p||!p[0]){NV={};nvSave();throw new Error('Ainda não tem acesso. Fale com o dono.')}
   if(p[0].ativo===false){NV={};nvSave();throw new Error('O seu acesso está desativado. Fale com o dono.')}
   NV.papel=p[0].papel;NV.paginas=p[0].paginas||[];nvSave();
   window.__entrada=true;await nvSync(true);window.__entrada=false;
   try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
   g.remove();document.body.classList.remove('gated');sairBtn();render()}
  catch(e){window.__entrada=false;st.textContent=e.message;bt.disabled=false}}}
/* ---------- equipa (só o dono): criar acessos e escolher páginas ---------- */
const linkApp=()=>/^https?:$/.test(location.protocol)?location.origin+location.pathname:'';
async function eqApi(acao,dados={}){const{u,k}=nvCfg(),tk=await nvTok();
 const r=await fetch(u+'/functions/v1/gerir-equipa',{method:'POST',headers:{apikey:k,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({acao,redirectTo:linkApp()},dados))});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||('Erro '+r.status+' (a função gerir-equipa já está publicada?)'));return j}
function vEquipa(m){m.innerHTML=`<h2>Equipa</h2><p class="sub" style="margin:-6px 0 6px"><b>Só o administrador vê esta página.</b> Aqui dá e retira acessos e escolhe quem é administrador.</p>
 <div class="card"><h3 style="margin-bottom:6px">Quem pode o quê</h3><ul class="sub" style="margin:0;padding-left:18px"><li><b>Administrador</b>: vê e altera tudo, incluindo custos, definições e esta página. Use só com quem confia totalmente.</li><li><b>Funcionário</b>: vê sempre Guias e Stock, mais as páginas que marcar para ele.</li><li>Cada pessoa deve ter o seu próprio acesso. Com o mesmo login para duas pessoas, a aplicação não sabe quem fez cada alteração.</li></ul></div>
 ${equipaCard()}`;if($('#eqCard'))eqIniciar()}
function equipaCard(){if(!nvOn()||NV.papel!=='admin')return'';
 return `<div class="card" id="eqCard"><h3 style="margin-bottom:6px">Equipa — acessos dos funcionários</h3>
 <p class="sub" style="margin-top:0">Escreva o e-mail do funcionário e escolha as páginas que ele pode ver. Todos veem sempre <b>Guias</b> e <b>Stock</b>. O funcionário recebe um link seu (por WhatsApp ou e-mail), cria a palavra-passe e entra. Pode mudar as páginas, desativar ou remover a qualquer momento.</p>
 <div id="eqLista" class="sub">A carregar…</div>
 <div class="grid w2" style="margin-top:12px"><label>Nome<input id="eqNome" placeholder="ex.: Pedro"></label><label>E-mail<input id="eqEmail" type="email" placeholder="ex.: pedro@exemplo.pt"></label></div>
 <div class="sub" style="margin:8px 0 4px">Páginas extra:</div><div class="bar" style="margin:0 0 8px;gap:12px">${PAG_OPC.map(([k,l])=>`<label style="display:flex;flex-direction:row;gap:6px;align-items:center"><input type="checkbox" data-eqnovo="${k}" style="width:auto">${l}</label>`).join('')}</div>
 <div class="bar" style="margin:0"><button class="btn pri" id="eqCriar">Criar acesso e gerar link</button></div>
 <div id="eqLink" style="margin-top:10px"></div>
 ${linkApp()?'':'<div class="sub" style="margin-top:8px;color:#a15c00">Nota: o link só funciona quando a app estiver publicada com endereço https. Pode criar já os acessos; depois gere o link com “Novo link”.</div>'}</div>`}
function eqLinhaHTML(m){const adm=m.papel==='admin';
 const est=m.ativo===false?'desativado':(m.pendente?'ainda não entrou':'ativo');
 const eu=(NV.sess&&NV.sess.email||'').toLowerCase()===String(m.email||'').toLowerCase();
 const pg=adm?'<span class="sub">Administrador: vê e altera tudo'+(eu?' (é você)':'')+'</span>':PAG_OPC.map(([k,l])=>`<label style="display:flex;flex-direction:row;gap:5px;align-items:center;font-size:13px"><input type="checkbox" data-eqp="${m.id}|${k}" ${(m.paginas||[]).includes(k)?'checked':''} style="width:auto">${l}</label>`).join('');
 return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(m.nome||m.email)}</b> <span class="sub">${esc(m.email)} · ${est}</span></div>
 ${adm?(eu?'':`<div class="bar" style="margin:0"><button class="btn sm" data-eqp2="${m.id}|func">Passar a funcionário</button></div>`):`<div class="bar" style="margin:0"><button class="btn sm" data-eqp2="${m.id}|admin">Tornar administrador</button><button class="btn sm" data-eql="${m.id}">Novo link</button><button class="btn sm" data-eqa="${m.id}">${m.ativo===false?'Ativar':'Desativar'}</button><button class="btn sm danger" data-eqr="${m.id}">Remover</button></div>`}</div>
 <div class="bar" style="margin:8px 0 0;gap:12px">${pg}</div></div>`}
function eqMostraLink(link,nome){const b=$('#eqLink');if(!b)return;
 const txt='Olá'+(nome?' '+nome:'')+'! Este é o seu acesso a Preços e Guias. Abra o link, crie a sua palavra-passe e entre: '+link;
 b.innerHTML=`<div class="sub">Link para enviar ao funcionário (use uma só vez, expira em pouco tempo):</div><input id="eqLk" readonly value="${esc(link)}" style="width:100%;margin:6px 0"><div class="bar" style="margin:0"><button class="btn" id="eqCp">Copiar link</button><a class="btn" style="text-decoration:none;color:var(--ink)" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a></div>`;
 $('#eqCp').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link copiado')}catch(e){$('#eqLk').select();toast('Selecione e copie o link')}}}
async function eqIniciar(){const L=$('#eqLista');
 const pinta=async()=>{try{const r=await eqApi('listar');L.innerHTML=(r.equipa||[]).map(eqLinhaHTML).join('')||'<div class="sub">Ainda sem funcionários.</div>';ligar()}catch(e){L.textContent=e.message}};
 const ligar=()=>{
  L.querySelectorAll('[data-eqp]').forEach(c=>c.onchange=async()=>{const[id]=c.dataset.eqp.split('|');const pags=[...L.querySelectorAll('[data-eqp^="'+id+'|"]')].filter(x=>x.checked).map(x=>x.dataset.eqp.split('|')[1]);try{await eqApi('atualizar',{id,paginas:pags});toast('Páginas guardadas')}catch(e){toast(e.message)}});
  L.querySelectorAll('[data-eqp2]').forEach(b=>b.onclick=async()=>{const[id,papel]=b.dataset.eqp2.split('|');const msg=papel==='admin'?'Tornar este utilizador administrador?\n\nVai ver e alterar tudo: custos, margens, clientes, equipa e definições. Só deve fazê-lo a quem confia totalmente.':'Passar este administrador a funcionário? Fica só com as páginas que escolher.';if(!confirm(msg))return;try{await eqApi('papel',{id,papel});pinta()}catch(e){toast(e.message)}});
  L.querySelectorAll('[data-eql]').forEach(b=>b.onclick=async()=>{try{const r=await eqApi('novolink',{id:b.dataset.eql});eqMostraLink(r.link,'')}catch(e){toast(e.message)}});
  L.querySelectorAll('[data-eqa]').forEach(b=>b.onclick=async()=>{try{await eqApi('ativar',{id:b.dataset.eqa,ativo:b.textContent.trim()==='Ativar'});pinta()}catch(e){toast(e.message)}});
  L.querySelectorAll('[data-eqr]').forEach(b=>b.onclick=async()=>{if(!confirm('Remover este funcionário? Perde o acesso de imediato.'))return;try{await eqApi('remover',{id:b.dataset.eqr});pinta()}catch(e){toast(e.message)}})};
 $('#eqCriar').onclick=async()=>{const email=$('#eqEmail').value.trim(),nome=$('#eqNome').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Escreva um e-mail válido');return}
  const paginas=[...document.querySelectorAll('[data-eqnovo]')].filter(x=>x.checked).map(x=>x.dataset.eqnovo);
  try{const r=await eqApi('convidar',{email,nome,paginas});eqMostraLink(r.link,nome);$('#eqEmail').value='';$('#eqNome').value='';pinta()}catch(e){toast(e.message)}};
 pinta()}
/* ---------- arranque ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t)go(t.dataset.tab)});
load();
{const cv=lerHashConvite();if(cv){cv.erro?mostraEntrada(cv.erro):mostraDefinirSenha(cv)}else if(nvOn()){sairBtn();render()}else{mostraEntrada()}}
</script>
</body>
